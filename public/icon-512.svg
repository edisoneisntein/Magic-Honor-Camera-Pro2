<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141414" />
      <stop offset="100%" stop-color="#020202" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFB340" />
      <stop offset="100%" stop-color="#FF9500" />
    </linearGradient>
    <radialGradient id="lens" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0a192f" />
      <stop offset="60%" stop-color="#050d18" />
      <stop offset="100%" stop-color="#000000" />
    </radialGradient>
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9500" />
      <stop offset="50%" stop-color="#333333" />
      <stop offset="100%" stop-color="#FF9500" />
    </linearGradient>
  </defs>

  <!-- Background rounded app icon -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" stroke="#333333" stroke-width="8" />

  <!-- Camera Body Outer Ring -->
  <circle cx="256" cy="256" r="176" fill="none" stroke="url(#ring)" stroke-width="12" />
  <circle cx="256" cy="256" r="156" fill="url(#lens)" stroke="#222222" stroke-width="6" />

  <!-- Inner Lens Elements with Glass Reflections -->
  <circle cx="256" cy="256" r="110" fill="#000000" stroke="#00ffff" stroke-width="2" stroke-opacity="0.4" />
  <circle cx="256" cy="256" r="70" fill="#040b14" stroke="#ff0055" stroke-width="1.5" stroke-opacity="0.5" />
  <circle cx="256" cy="256" r="30" fill="url(#accent)" />

  <!-- Lens Flare / Reflection -->
  <ellipse cx="220" cy="210" rx="45" ry="25" transform="rotate(-35 220 210)" fill="#ffffff" fill-opacity="0.18" />
  <ellipse cx="285" cy="295" rx="20" ry="10" transform="rotate(-35 285 295)" fill="#00ffff" fill-opacity="0.25" />

  <!-- 108MP PRO Badge -->
  <rect x="186" y="70" width="140" height="34" rx="17" fill="#FF9500" />
  <text x="256" y="93" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="16" fill="#000000" text-anchor="middle" letter-spacing="1.5">108MP PRO</text>

  <!-- Corner Focusing Reticle Accents -->
  <path d="M 120 180 L 120 150 L 150 150" stroke="#FF9500" stroke-width="5" fill="none" stroke-linecap="round" />
  <path d="M 392 180 L 392 150 L 362 150" stroke="#FF9500" stroke-width="5" fill="none" stroke-linecap="round" />
  <path d="M 120 332 L 120 362 L 150 362" stroke="#FF9500" stroke-width="5" fill="none" stroke-linecap="round" />
  <path d="M 392 332 L 392 362 L 362 362" stroke="#FF9500" stroke-width="5" fill="none" stroke-linecap="round" />
</svg>
